<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北斗系统任务看板</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #c9d1d9; --dim: #8b949e;
    --green: #3fb950; --red: #f85149; --purple: #a371f7; --blue: #58a6ff; --orange: #d29922;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width:100%; margin:0 auto; padding:24px 40px; font-size:20px; }
  header { text-align:center; padding:10px 0 14px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  header h1 { font-size:1.7em; color:var(--purple); }
  header .time { font-size:0.85em; color:var(--dim); margin-top:4px; }
  .nav-buttons { display:flex; gap:8px; justify-content:center; margin:8px 0; }
  .nav-btn { padding:6px 18px; border-radius:6px; text-decoration:none; font-size:0.8em; font-weight:600; border:1px solid #30363d; }
  .nav-btn.home { color:#ffd54f; background:rgba(13,17,23,0.92); }
  .nav-btn.curator { color:var(--purple); background:rgba(163,113,247,0.08); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:14px; }
  .card summary { cursor:pointer; font-weight:600; font-size:1.15em; color:var(--blue); list-style:none; }
  .card summary::-webkit-details-marker { display:none; }
  .card summary::before { content:'▸ '; font-size:0.9em; }
  .card details[open] summary::before { content:'▾ '; }
  .card details[open] summary { margin-bottom:8px; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:3px; }
  .dot.on { background:var(--green); box-shadow:0 0 5px var(--green); }
  .dot.off { background:var(--red); box-shadow:0 0 5px var(--red); }
  .agents-row { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-start; }
  .agent { text-align:left; padding:8px 6px; border-radius:6px; background:rgba(255,255,255,0.02); font-size:0.78em; flex:1; min-width:80px; }
  .agent.on { border:1px solid rgba(63,185,80,0.25); }
  .agent.off { border:1px solid rgba(248,81,73,0.25); opacity:0.5; }
  .agent .icon { font-size:1.3em; display:block; }
  .section-title { font-size:1.0em; color:var(--dim); padding:10px 0 5px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .item { font-size:1.0em; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
  .item:last-child { border:none; }
  .tag { display:inline-block; padding:2px 6px; border-radius:3px; font-size:0.72em; margin-right:4px; background:rgba(163,113,247,0.12); color:var(--purple); }
  .tag-green { background:rgba(63,185,80,0.12); color:var(--green); }
  .two-col { display:flex; gap:16px; }
  .two-col>div { flex:1; min-width:0; }
  .match { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:1.0em; border-bottom:1px solid rgba(255,255,255,0.03); }
  .match:last-child { border:none; }
  .match .score { font-weight:bold; }
  .hit { color:var(--green); }
  .miss { color:var(--red); }
  .pending { color:var(--dim); }
  .cost { text-align:left; padding:8px; font-size:0.82em; color:var(--dim); }
  .cost b { color:var(--purple); }
  footer { text-align:center; padding:14px; color:var(--dim); font-size:0.8em; }
  .loading { text-align:left; color:var(--dim); padding:14px; font-size:1.0em; }
  .news-item { font-size:0.92em; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
  .news-item a { color:var(--text); text-decoration:none; }
  .news-item a:hover { color:var(--blue); }
  .news-updated { font-size:0.72em; color:var(--dim); margin-bottom:6px; }
  .scroll-box { max-height:360px; overflow-y:auto; }
  .scroll-box::-webkit-scrollbar { width:4px; }
  .scroll-box::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .token-num { font-family:'SF Mono','Cascadia Code',monospace; font-size:0.82em; color:var(--dim); text-align:left; padding:8px; }
  .token-num b { color:var(--purple); font-size:1.0em; }
  .review-item { font-size:0.85em; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.02); }
  .review-item:last-child { border:none; }
  .full-width { width:100%; }
  .label-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
</style>
</head>
<body>

<div class="nav-buttons">
  <a href="/" class="nav-btn home">← 返回 ainoai</a>
  <a href="/dashboard/curator/" class="nav-btn curator">🧹 北斗系统管家</a>
</div>
<header>
  <h1>🛡️ 北斗系统任务看板</h1>
  <div class="time" id="clock">加载中...</div>
</header>

<!-- 运行日报 -->
<div class="card">
  <details open>
    <summary>🌅 运行日报</summary>
    <div class="two-col">
      <div>
        <div class="section-title">📋 今日任务 <span style="font-size:0.7em;color:var(--dim)">(2026-05-27)</span></div>
        <div id="dailyTasks" class="loading">--</div>
      </div>
      <div>
        <div class="section-title">📚 知识库更新</div>
        <div class="scroll-box"><div id="dailyKB" class="loading">--</div></div>
      </div>
    </div>
    <div class="section-title">💰 Token 消耗</div>
    <div id="dailyToken" class="loading">--</div>
  </details>
</div>

<!-- 新闻 -->
<div class="card">
  <details open>
    <summary>📰 每日新闻</summary>
    <div class="two-col">
      <div>
        <div class="label-row">
          <span style="font-weight:600;color:var(--purple);font-size:0.95em;">🤖 AI新闻</span>
          <span class="news-updated" id="aiNewsUpdated" style="margin:0"></span>
        </div>
        <div id="aiNewsList" class="loading">--</div>
      </div>
      <div>
        <div class="label-row">
          <span style="font-weight:600;color:var(--orange);font-size:0.95em;">🌐 综合新闻</span>
          <span class="news-updated" id="newsSource" style="margin:0"></span>
        </div>
        <div class="scroll-box"><div id="newsList" class="loading">--</div></div>
      </div>
    </div>
  </details>
</div>

<!-- 足球 -->
<div class="card">
  <details open>
    <summary>⚽ 足球</summary>
    <div class="two-col">
      <div>
        <div class="section-title">🔮 今日比赛预测</div>
        <div class="scroll-box"><div id="predictions" class="loading">--</div></div>
      </div>
      <div>
        <div class="section-title">📊 前日赛果复盘</div>
        <div class="scroll-box"><div id="review" class="loading">--</div></div>
      </div>
    </div>
  </details>
</div>

<!-- 系统状态 (七大北斗Agent) -->
<div class="card">
  <details>
    <summary>🛡️ 系统状态</summary>
    <div class="agents-row" id="agents"></div>
    <div class="cost">今日成本 <b id="costToday">¥--</b> · 本月 <b id="costMonth">¥--</b></div>
    <div class="token-num">今日 <b id="tokensToday">--</b> tokens · 本月 <b id="tokensMonth">--</b> tokens</div>
  </details>
</div>

<footer>北斗系统 · <span id="refreshInfo"></span></footer>

<script>
const AGENTS = [
  { id:'tianshu',  name:'天枢·贪狼', icon:'🧠', role:'大脑中枢', port:18801 },
  { id:'tianxuan', name:'天璇·巨门', icon:'🛡️', role:'记忆守夜', port:18804 },
  { id:'tianji',   name:'天玑·禄存', icon:'💰', role:'执行部署', port:18805 },
  { id:'tianquan', name:'天权·文曲', icon:'📜', role:'文案润色', port:18790 },
  { id:'yuheng',   name:'玉衡·廉贞', icon:'⚖️', role:'代码审查', port:18807 },
  { id:'kaiyang',  name:'开阳·武曲', icon:'💪', role:'代码编写', port:18806 },
  { id:'yaoguang', name:'瑶光·破军', icon:'🚀', role:'视觉生成', port:18789 },
];

function fmt(n) { return n ? n.toLocaleString() : '--'; }

async function load() {
  try {
    const r = await fetch('data/status.json?t='+Date.now());
    const d = await r.json();
    renderSystem(d.system);
    renderDaily(d.daily);
    renderAiNews(d.ai_news);
    renderNews(d.news);
    renderFootball(d.football);
    document.getElementById('costToday').textContent = '$'+(d.token?.today||0).toFixed(2);
    document.getElementById('costMonth').textContent = '$'+(d.token?.month||0).toFixed(2);
    document.getElementById('tokensToday').textContent = fmt(d.token?.today_tokens);
    document.getElementById('tokensMonth').textContent = fmt(d.token?.month_tokens);
    document.getElementById('clock').textContent = '更新于 '+(d.updated||'--');
    document.getElementById('refreshInfo').textContent = '每5分钟自动刷新';
  } catch(e) { 
    document.getElementById('clock').textContent = '数据加载失败 - ' + e.message;
    renderDefaultData();
  }
}

function renderSystem(sys) {
  if (!sys) return;
  document.getElementById('agents').innerHTML = AGENTS.map(a => {
    const ok = sys[a.id] ? sys[a.id].status : false;
    return `<div class="agent ${ok?'on':'off'}">
      <span class="icon">${a.icon}</span>
      <span class="dot ${ok?'on':'off'}"></span>${a.name}
      <div style="font-size:0.65em;color:var(--dim)">${a.role}</div>
    </div>`;
  }).join('');
}

// Fallback: today's actual activity
function renderDefaultData() {
  document.getElementById('dailyTasks').innerHTML = [
    '<div class="item"><span class="tag tag-green">P0</span>开阳→MiMo V2.5 Pro 切换完成</div>',
    '<div class="item"><span class="tag tag-green">P0</span>天权→Qwen3-32B@震泽 切换完成</div>',
    '<div class="item"><span class="tag tag-green">P1</span>天璇 GLM-5.1@火山 重新启用</div>',
    '<div class="item"><span class="tag">P2</span>SSH config 补 cloudwin 别名</div>',
    '<div class="item"><span class="tag">P3</span>Obsidian 27200 SSH 隧道持久化</div>',
    '<div class="item"><span class="tag">P4</span>Dashboard 端口配置修正</div>',
    '<div class="item"><span class="tag tag-green">新增</span>Curator 技能管家板块</div>',
  ].join('');
}

function renderDaily(d) {
  if (!d || !d.tasks?.length) { renderDefaultData(); return; }
  document.getElementById('dailyTasks').innerHTML = d.tasks.map(t=>`<div class="item">${t}</div>`).join('');
  document.getElementById('dailyKB').innerHTML = d.kb?.map(k=>`<div class="item">${k}</div>`).join('')||'<div class="item">--</div>';
  document.getElementById('dailyToken').innerHTML = `<div class="item">${d.token_summary||'--'}</div>`;
}

function renderAiNews(n) {
  document.getElementById('aiNewsUpdated').textContent = n?.source ? n.source + (n.updated?' · '+n.updated:'') : '';
  if (!n?.items?.length) { 
    document.getElementById('aiNewsList').innerHTML='<div class="news-item"><a href="https://mp.weixin.qq.com/s?__biz=MzI5NTk5NDA3Nw==&mid=2247483921&idx=1&sn=3d6ed7befba4db1637e45b6748e9379f" target="_blank">Hermes Agent 6:5 击败 OpenAI Codex，Python打赢Rust</a></div><div class="news-item"><a href="https://www.jiqizhixin.com/articles/2026-05-27" target="_blank">Karpathy: 从Vibe Coding到Agentic Engineering</a></div><div class="news-item">今天00:00 MiMo V2.5全线降价99%</div>'; 
    return; 
  }
  document.getElementById('aiNewsList').innerHTML = n.items.map(i => {
    const tag = i.tag ? `<span class="tag">${i.tag}</span>` : '';
    return `<div class="news-item">${tag}<a href="${i.link||'#'}" target="_blank">${i.title}</a></div>`;
  }).join('');
}

function renderNews(n) {
  document.getElementById('newsSource').textContent = n?.source || '';
  if (!n?.items?.length) { document.getElementById('newsList').innerHTML='<div class="news-item">2026-05-27 神舟二十三号发射成功</div><div class="news-item">华为发布韬定律：半导体领域新突破</div><div class="news-item">最高检挂牌督办山西沁源煤矿爆炸案</div>'; return; }
  document.getElementById('newsList').innerHTML = n.items.map(i => {
    const tag = i.tag ? `<span class="tag">${i.tag}</span>` : '';
    return `<div class="news-item">${tag}<a href="${i.link||'#'}" target="_blank">${i.title}</a></div>`;
  }).join('');
}

function renderFootball(f) {
  const preds = f?.predictions||[];
  const review = f?.review;
  document.getElementById('predictions').innerHTML = preds.length 
    ? preds.map(m => {
        const cls = m.hit===true?'hit':m.hit===false?'miss':'pending';
        const home = m.home||m.home_team||'?';
        const away = m.away||m.away_team||'?';
        const pred = m.prediction_cn||m.prediction||'--';
        return `<div class="match"><span>${home} vs ${away}</span><span class="score ${cls}">${pred}</span></div>`;
      }).join('')
    : '<div class="item">今日无比赛</div>';
  
  if (review) {
    let html = `<div class="item">命中 ${review.hit}/${review.total} (比分) + ${review.direction||0}/${review.total} (方向)</div>`;
    if (review.detail?.length) html += review.detail.map(d => `<div class="review-item">${d}</div>`).join('');
    document.getElementById('review').innerHTML = html;
  } else {
    document.getElementById('review').innerHTML = '<div class="item">暂无复盘数据</div>';
  }
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
