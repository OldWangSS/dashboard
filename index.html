};
const categories = {"概念": {"color": "#ff6b6b", "name": "核心概念"}, "政企产品": {"color": "#4ecdc4", "name": "政企产品"}, "读书": {"color": "#ffe66d", "name": "读书笔记"}, "视频笔记": {"color": "#a29bfe", "name": "视频消化"}, "足球知识库": {"color": "#fd79a8", "name": "足球知识"}, "外部": {"color": "#74b9ff", "name": "外部验证"}};

// Build legend
const legend = d3.select("#legend");
Object.entries(categories).forEach(([key, val]) => {
  legend.append("div")
    .attr("class", "legend-item")
    .html(`<div class="legend-dot" style="background:${val.color}"></div>${val.name}`);
});

const svg = d3.select("#graph"),
    width = window.innerWidth,
    height = window.innerHeight;

const g = svg.append("g");

const simulation = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width/2, height/2))
    .force("collision", d3.forceCollide(40));

const link = g.append("g")
    .selectAll("line")
    .data(data.links)
    .join("line")
    .attr("class", "link");

const node = g.append("g")
    .selectAll("g")
    .data(data.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
        .on("start", (e,d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
        .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
        .on("end", (e,d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; })
    );

node.append("circle")
    .attr("r", d => {
        const conns = data.links.filter(l => l.source.id===d.id || l.target.id===d.id).length;
        return 4 + conns * 0.5;
    })
    .attr("fill", d => d.color);

node.append("text")
    .attr("dy", 20)
    .text(d => d.id);

// Click for highlight
let clickStart = null;
node.on("mousedown", (e,d) => { clickStart = [e.clientX, e.clientY]; });
node.on("mouseup", (e,d) => {
    if (!clickStart) return;
    const dx = e.clientX - clickStart[0], dy = e.clientY - clickStart[1];
    clickStart = null;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) return;
    
    // Reset all
    node.classed("highlight", false);
    link.classed("highlight", false);
    
    // Highlight connected
    const connected = new Set();
    connected.add(d.id);
    data.links.forEach(l => {
        const src = l.source.id || l.source;
        const tgt = l.target.id || l.target;
        if (src === d.id) connected.add(tgt);
        if (tgt === d.id) connected.add(src);
    });
    
    node.classed("highlight", n => connected.has(n.id));
    link.classed("highlight", l => {
        const src = l.source.id || l.source;
        const tgt = l.target.id || l.target;
        return src === d.id || tgt === d.id;
    });
    
    // Pop connected nodes forward
    simulation.alpha(0.1).restart();
});

simulation.on("tick", () => {
    link.attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// Zoom
svg.call(d3.zoom().scaleExtent([0.3, 5]).on("zoom", (e) => {
    g.attr("transform", e.transform);
}));
</script>
