<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abyss 控制台</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #21262d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --purple: #a371f7;
    --blue: #58a6ff;
    --orange: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: 600px; margin: 0 auto; padding: 16px; min-height: 100vh;
  }
  header {
    text-align: center; padding: 8px 0 16px;
    border-bottom: 1px solid var(--border); margin-bottom: 16px;
  }
  header h1 { font-size: 1.4em; color: var(--purple); }
  header .time { font-size: 0.8em; color: var(--dim); margin-top: 4px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; margin-bottom: 12px;
  }
  .card summary { cursor: pointer; font-weight: 600; font-size: 1em; color: var(--blue); }
  .card details[open] summary { margin-bottom: 10px; }
  .card summary::marker { font-size: 0.8em; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .agent { 
    flex: 1; min-width: 60px; text-align: center; padding: 8px 4px;
    border-radius: 6px; background: rgba(255,255,255,0.03); font-size: 0.8em;
  }
  .agent .name { display: block; margin-top: 4px; }
  .agent.on { border: 1px solid rgba(63,185,80,0.3); }
  .agent.off { border: 1px solid rgba(248,81,73,0.3); opacity: 0.6; }
  .news-item { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.9em; }
  .news-item:last-child { border: none; }
  .news-item a { color: var(--text); text-decoration: none; }
  .news-item a:hover { color: var(--blue); }
  .tag { 
    display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.7em; 
    margin-right: 4px; background: rgba(163,113,247,0.15); color: var(--purple);
  }
  .match { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 0.85em; border-bottom: 1px solid var(--border); }
  .match:last-child { border: none; }
  .match .score { font-weight: bold; }
  .hit { color: var(--green); }
  .miss { color: var(--red); }
  .pending { color: var(--dim); }
  .token-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .token-bar div { height: 100%; background: var(--purple); border-radius: 2px; }
  footer { text-align: center; padding: 16px; color: var(--dim); font-size: 0.7em; }
  .loading { text-align: center; color: var(--dim); padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🦞 Abyss 控制台</h1>
  <div class="time" id="clock">加载中...</div>
</header>

<div class="card">
  <details open>
    <summary>🛡️ 系统状态</summary>
    <div class="grid" id="agents"></div>
  </details>
</div>

<div class="card">
  <details>
    <summary>🌅 今日早报</summary>
    <div id="briefing" class="loading">等待首次运行...</div>
  </details>
</div>

<div class="card">
  <details>
    <summary>⚽ 足球预测</summary>
    <div id="football" class="loading">等待首次运行...</div>
  </details>
</div>

<div class="card">
  <details>
    <summary>📰 今日新闻</summary>
    <div id="news" class="loading">等待首次运行...</div>
  </details>
</div>

<div class="card" id="weeklyCard" style="display:none">
  <details>
    <summary>📋 每周汇总</summary>
    <div id="weekly" class="loading"></div>
  </details>
</div>

<div style="text-align:center; padding:8px; color:var(--dim); font-size:0.8em">
  每日 ¥<span id="tokenCost">--</span> · <span id="refreshInfo">自动刷新</span>
</div>

<footer>Abyss Dashboard · OldWangSS</footer>

<script>
const AGENTS = [
  { id: 'abyss',    name: 'Abyss',   emoji: '🧠', depends: null },
  { id: 'hermes',   name: 'Hermes',  emoji: '💻', depends: 'abyss' },
  { id: 'hmcode',   name: 'Hmcode',  emoji: '📝', depends: 'abyss' },
  { id: 'catclaw',  name: 'CatClaw', emoji: '🦞', depends: null },
  { id: 'homebot',  name: 'HomeBot', emoji: '🏠', depends: 'catclaw' },
];

async function load() {
  try {
    const r = await fetch('data/status.json?t=' + Date.now());
    const d = await r.json();
    renderSystem(d.system);
    renderBriefing(d.briefing);
    renderFootball(d.football);
    renderNews(d.news);
    renderWeekly(d.weekly);
    document.getElementById('tokenCost').textContent = d.token?.today?.toFixed(2) || '--';
    document.getElementById('clock').textContent = '更新于 ' + (d.updated || '--');
  } catch(e) {
    document.getElementById('clock').textContent = '数据加载失败';
  }
}

function renderSystem(sys) {
  const el = document.getElementById('agents');
  el.innerHTML = AGENTS.map(a => {
    const alive = a.depends ? sys[a.depends] : sys[a.id];
    const cls = alive ? 'on' : 'off';
    return `<div class="agent ${cls}">
      <span class="dot ${alive ? 'on' : 'off'}"></span>
      <span class="name">${a.emoji} ${a.name}</span>
    </div>`;
  }).join('');
}

function renderBriefing(b) {
  const el = document.getElementById('briefing');
  if (!b?.items?.length) { el.innerHTML = '<div class="loading">等待首次运行...</div>'; return; }
  el.innerHTML = `<p style="font-size:0.9em">${b.title || ''}</p>` +
    b.items.map(i => `<div style="font-size:0.85em;padding:3px 0">${i}</div>`).join('');
}

function renderFootball(f) {
  const el = document.getElementById('football');
  const preds = f?.predictions || [];
  const review = f?.review;
  if (!preds.length && !review) { el.innerHTML = '<div class="loading">等待首次运行...</div>'; return; }
  
  let html = '';
  if (preds.length) {
    html += preds.map(m => {
      const cls = m.hit === true ? 'hit' : m.hit === false ? 'miss' : 'pending';
      return `<div class="match">
        <span>${m.home || '?'} vs ${m.away || '?'}</span>
        <span class="score ${cls}">${m.prediction || '待预测'}</span>
      </div>`;
    }).join('');
  }
  if (review) {
    html += `<div style="margin-top:8px;font-size:0.8em;color:var(--dim)">📊 复盘: ${review.hit}/${review.total} 命中 (${review.rate})</div>`;
  }
  el.innerHTML = html;
}

function renderNews(n) {
  const el = document.getElementById('news');
  if (!n?.items?.length) { el.innerHTML = '<div class="loading">等待首次运行...</div>'; return; }
  el.innerHTML = (n.source ? `<div style="font-size:0.75em;color:var(--dim);margin-bottom:6px">来源: ${n.source}</div>` : '') +
    n.items.map(i => {
      const tag = i.tag ? `<span class="tag">${i.tag}</span>` : '';
      return `<div class="news-item">${tag}<a href="${i.link || '#'}" target="_blank">${i.title}</a></div>`;
    }).join('');
}

function renderWeekly(w) {
  const card = document.getElementById('weeklyCard');
  if (!w) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  document.getElementById('weekly').innerHTML = w.items?.map(i => `<div style="font-size:0.85em;padding:3px 0">${i}</div>`).join('') || '暂无数据';
}

load();
setInterval(load, 300000); // 5min refresh
</script>
</body>
</html>
