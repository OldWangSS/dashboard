<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>王叔的任务看板</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #c9d1d9; --dim: #8b949e;
    --green: #3fb950; --red: #f85149; --purple: #a371f7; --blue: #58a6ff; --orange: #d29922;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; max-width:600px; margin:0 auto; padding:14px; font-size:18px; }
  header { text-align:center; padding:8px 0 12px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  header h1 { font-size:1.5em; color:var(--purple); }
  header .time { font-size:0.82em; color:var(--dim); margin-top:3px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px; }
  .card summary { cursor:pointer; font-weight:600; font-size:1.05em; color:var(--blue); list-style:none; }
  .card summary::-webkit-details-marker { display:none; }
  .card summary::before { content:'▸ '; font-size:0.85em; }
  .card details[open] summary::before { content:'▾ '; }
  .card details[open] summary { margin-bottom:8px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; }
  .dot.on { background:var(--green); box-shadow:0 0 5px var(--green); }
  .dot.off { background:var(--red); box-shadow:0 0 5px var(--red); }
  .agents-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .agent { text-align:center; padding:8px 4px; border-radius:6px; background:rgba(255,255,255,0.02); font-size:0.85em; flex:1; min-width:55px; }
  .agent.on { border:1px solid rgba(63,185,80,0.25); }
  .agent.off { border:1px solid rgba(248,81,73,0.25); opacity:0.5; }
  .agent .icon { font-size:1.3em; display:block; }
  .section-title { font-size:0.9em; color:var(--dim); padding:8px 0 4px; border-bottom:1px solid var(--border); margin-bottom:8px; }
  .item { font-size:0.92em; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
  .item:last-child { border:none; }
  .tag { display:inline-block; padding:2px 6px; border-radius:3px; font-size:0.75em; margin-right:5px; background:rgba(163,113,247,0.12); color:var(--purple); }
  .two-col { display:flex; gap:10px; }
  .two-col>div { flex:1; }
  .match { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:0.92em; border-bottom:1px solid rgba(255,255,255,0.03); }
  .match:last-child { border:none; }
  .match .score { font-weight:bold; }
  .hit { color:var(--green); }
  .miss { color:var(--red); }
  .pending { color:var(--dim); }
  .cost { text-align:center; padding:8px; font-size:0.88em; color:var(--dim); }
  .cost b { color:var(--purple); }
  footer { text-align:center; padding:12px; color:var(--dim); font-size:0.72em; }
  .loading { text-align:center; color:var(--dim); padding:12px; font-size:0.92em; }
  .news-item { font-size:0.92em; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
  .news-item a { color:var(--text); text-decoration:none; }
  .news-item a:hover { color:var(--blue); }
</style>
</head>
<body>

<header>
  <h1>📋 王叔的任务看板</h1>
  <div class="time" id="clock">加载中...</div>
</header>

<!-- 1. 运行早报 -->
<div class="card">
  <details open>
    <summary>🌅 运行早报</summary>
    <div class="section-title">📋 昨日重要任务</div>
    <div id="dailyTasks" class="loading">--</div>
    <div class="section-title">📚 知识库更新</div>
    <div id="dailyKB" class="loading">--</div>
    <div class="section-title">💰 Token 消耗</div>
    <div id="dailyToken" class="loading">--</div>
  </details>
</div>

<!-- 2. 今日新闻 -->
<div class="card">
  <details>
    <summary>📰 今日新闻</summary>
    <div id="newsSource" style="font-size:0.72em;color:var(--dim);margin-bottom:4px"></div>
    <div id="newsList" class="loading">等待首次运行...</div>
  </details>
</div>

<!-- 3. 足球预测 + 复盘 -->
<div class="card">
  <details>
    <summary>⚽ 足球预测 & 复盘</summary>
    <div class="two-col">
      <div>
        <div class="section-title">🔮 预测</div>
        <div id="predictions" class="loading">--</div>
      </div>
      <div>
        <div class="section-title">📊 复盘</div>
        <div id="review" class="loading">--</div>
      </div>
    </div>
  </details>
</div>

<!-- 4. 运行周报（周一显示） -->
<div class="card" id="weeklyCard" style="display:none">
  <details>
    <summary>📋 运行周报</summary>
    <div class="section-title">📋 上周重要任务</div>
    <div id="weeklyTasks" class="loading">--</div>
    <div class="section-title">📚 知识库更新</div>
    <div id="weeklyKB" class="loading">--</div>
    <div class="section-title">💰 Token 消耗</div>
    <div id="weeklyToken" class="loading">--</div>
  </details>
</div>

<!-- 5. 系统状态（最底） -->
<div class="card">
  <details open>
    <summary>🛡️ 系统状态</summary>
    <div class="agents-row" id="agents"></div>
    <div class="cost">今日成本 <b id="costToday">¥--</b> · 本月 <b id="costMonth">¥--</b></div>
  </details>
</div>

<footer>Abyss Dashboard · OldWangSS · <span id="refreshInfo"></span></footer>

<script>
const AGENTS = [
  { id:'abyss',   name:'Abyss',   icon:'🧠', depends:null },
  { id:'catclaw', name:'CatClaw', icon:'🦞', depends:null },
  { id:'hermes',  name:'Hermes',  icon:'💻', depends:'abyss' },
  { id:'hmcode',  name:'Hmcode',  icon:'📝', depends:'abyss' },
  { id:'homebot', name:'HomeBot', icon:'🏠', depends:'catclaw' },
];

async function load() {
  try {
    const r = await fetch('data/status.json?t='+Date.now());
    const d = await r.json();
    renderSystem(d.system);
    renderDaily(d.daily);
    renderNews(d.news);
    renderFootball(d.football);
    renderWeekly(d.weekly);
    document.getElementById('costToday').textContent = '¥'+(d.token?.today||0).toFixed(2);
    document.getElementById('costMonth').textContent = '¥'+(d.token?.month||0).toFixed(2);
    document.getElementById('clock').textContent = '更新于 '+(d.updated||'--');
    document.getElementById('refreshInfo').textContent = '每5分钟自动刷新';
  } catch(e) { document.getElementById('clock').textContent = '数据加载失败'; }
}

function renderSystem(sys) {
  document.getElementById('agents').innerHTML = AGENTS.map(a => {
    const ok = a.depends ? sys[a.depends] : sys[a.id];
    return `<div class="agent ${ok?'on':'off'}">
      <span class="icon">${a.icon}</span>
      <span class="dot ${ok?'on':'off'}"></span>${a.name}
    </div>`;
  }).join('');
}

function renderDaily(d) {
  if (!d) return;
  document.getElementById('dailyTasks').innerHTML = d.tasks?.map(t=>`<div class="item">${t}</div>`).join('')||'<div class="item">--</div>';
  document.getElementById('dailyKB').innerHTML = d.kb?.map(k=>`<div class="item">${k}</div>`).join('')||'<div class="item">--</div>';
  document.getElementById('dailyToken').innerHTML = `<div class="item">${d.token_summary||'--'}</div>`;
}

function renderNews(n) {
  document.getElementById('newsSource').textContent = n?.source ? '来源: '+n.source : '';
  if (!n?.items?.length) { document.getElementById('newsList').innerHTML='<div class="loading">等待首次运行...</div>'; return; }
  document.getElementById('newsList').innerHTML = n.items.map(i => {
    const tag = i.tag ? `<span class="tag">${i.tag}</span>` : '';
    return `<div class="news-item">${tag}<a href="${i.link||'#'}" target="_blank">${i.title}</a></div>`;
  }).join('');
}

function renderFootball(f) {
  const preds = f?.predictions||[];
  const review = f?.review;
  document.getElementById('predictions').innerHTML = preds.length 
    ? preds.map(m => {
        const cls = m.hit===true?'hit':m.hit===false?'miss':'pending';
        return `<div class="match"><span>${m.home||'?'} vs ${m.away||'?'}</span><span class="score ${cls}">${m.prediction||'--'}</span></div>`;
      }).join('')
    : '<div class="item">--</div>';
  
  document.getElementById('review').innerHTML = review
    ? `<div class="item">命中 ${review.hit}/${review.total}（${review.rate}）</div>` +
      (review.detail||[]).map(d => `<div class="item" style="font-size:0.75em">${d}</div>`).join('')
    : '<div class="item">--</div>';
}

function renderWeekly(w) {
  const card = document.getElementById('weeklyCard');
  if (!w) { card.style.display='none'; return; }
  card.style.display='block';
  document.getElementById('weeklyTasks').innerHTML = w.tasks?.map(t=>`<div class="item">${t}</div>`).join('')||'--';
  document.getElementById('weeklyKB').innerHTML = w.kb?.map(k=>`<div class="item">${k}</div>`).join('')||'--';
  document.getElementById('weeklyToken').innerHTML = `<div class="item">${w.token_summary||'--'}</div>`;
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
