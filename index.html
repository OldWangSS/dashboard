<style>
  :root {
    --bg: #0d0d0d; --text: #c9d1d9; --dim: #6e7681;
    --line: #3a3a3a; --card: #151515; --border: #2a2a2a;

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden; height: 100vh; user-select: none;
  }
  .topbar {
    position: fixed; top:0; left:0; right:0; z-index:100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px;
    background: linear-gradient(180deg, rgba(13,13,13,0.98) 60%, rgba(13,13,13,0));
    pointer-events: none;
  }
  .topbar>*{pointer-events:auto}
  .logo { font-size: 1.1em; font-weight: 700; letter-spacing: 0.05em; color: #ffd54f; }
  .topbar-btns { display: flex; gap: 10px; }
  .topbar-btn {
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 0.85em;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
  }
  .topbar-btn:hover { border-color: #ff8a65; color: #ff8a65; }
  .topbar-btn.primary { background: #4fc3f7; color: #000; border-color: #4fc3f7; font-weight: 600; }

  #graph { width: 100vw; height: 100vh; cursor: grab; }
  #graph:active { cursor: grabbing; }

  .node circle { stroke-width: 1.2; cursor: pointer; transition: r 0.25s, fill 0.25s; }
  .node text { pointer-events: none; transition: fill 0.25s; }
  .link { stroke-opacity: 0.5; stroke-width: 1; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a1a1a; border: 1px solid #333;
    border-radius: 12px; padding: 24px 28px;
    max-width: 460px; width: 90%; max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,0.8);
  }
  .modal h2 { font-size: 1.2em; color: #ff8a65; margin-bottom: 8px; }
  .modal .tag {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 0.75em; margin-bottom: 14px;
  }
  .modal p { font-size: 0.9em; color: #b0b0b0; line-height: 1.7; }
  .modal-close {
    position: absolute; top: 12px; right: 20px;
    font-size: 1.4em; color: #888; cursor: pointer;
    background: none; border: none;
  }
  .modal-close:hover { color: #fff; }

  .tooltip {
    position: fixed; z-index: 250;
    background: #1a1a1a; border: 1px solid #333;
    border-radius: 6px; padding: 8px 14px; max-width: 220px;
    pointer-events: none; opacity: 0;
    transition: opacity 0.15s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip h3 { font-size: 0.9em; color: #ffd54f; margin-bottom: 2px; }
  .tooltip p { font-size: 0.75em; color: #888; }
  .footer {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 0.75em; color: #555; z-index: 100;
  }
  .legend {
    position: fixed; bottom: 14px; right: 20px; z-index: 100;
    font-size: 0.72em; display: flex; gap: 12px; opacity: 0.55;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>

// Assign each link a random warm color
LINKS.forEach(l => l._color = linkColors[Math.floor(Math.random()*linkColors.length)]);

// Sim — tighter layout
const sim = d3.forceSimulation(NODES)
  .force("link", d3.forceLink(LINKS).id(d => d.id).distance(60))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collision", d3.forceCollide(d => (catRadius[d.type]||7)+4));

// Links — colored
const link = g.append("g").selectAll("line")
  .data(LINKS).join("line")
  .attr("class", "link")
  .attr("stroke", d => d._color);

// Nodes
const node = g.append("g").selectAll("g")
  .data(NODES).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e,d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append("circle")
  .attr("r", d => catRadius[d.type] || 6)
  .attr("fill", d => catColors[d.type] || "#666")
  .attr("stroke", d => catStroke[d.type] || "#444");

node.append("text")
  .text(d => d.name.length > 10 ? d.name.slice(0,9)+"…" : d.name)
  .attr("text-anchor", "middle")
  .attr("dy", d => (catRadius[d.type]||6) + 12)
  .attr("fill", "#8b949e")
  .attr("font-size", d => d.type==="core"?"11px":(d.type==="concept"?"10px":"8px"));

// Hover
node.on("mouseenter", function(e,d) {
    d3.select(this).select("circle").transition().duration(200)
      .attr("r", (catRadius[d.type]||6)*1.6);
    tipTitle.text(d.name);
    tipDesc.text(catLabels[d.type]||d.type);
    tooltip.classed("show", true);
  })
  .on("mousemove", e => tooltip.style("left",(e.pageX+14)+"px").style("top",(e.pageY-46)+"px"))
  .on("mouseleave", function(e,d) {
    d3.select(this).select("circle").transition().duration(200)
      .attr("r", catRadius[d.type]||6);
    tooltip.classed("show", false);
  });

// Click → modal
node.on("click", function(e,d) {
  document.getElementById("modal-title").textContent = d.name;
  const tag = document.getElementById("modal-tag");
  tag.textContent = catLabels[d.type] || d.type;
  tag.style.background = catColors[d.type] + "33";
  tag.style.color = catColors[d.type];
  document.getElementById("modal-desc").textContent = d.desc || "暂无详细描述";
  document.getElementById("modal-overlay").classList.add("show");
});

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("show");
}

sim.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
